<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda Online</title>

  <link rel="icon" href="imagenes/favicon.png" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-dark bg-dark px-4 py-3">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <span class="navbar-brand fw-bold fs-4">TiendaOnline</span>
      <button class="btn border border-light text-light"
        data-bs-toggle="modal" data-bs-target="#authmodal"
        onmouseover="this.style.backgroundColor='white'; this.style.color='black';"
        onmouseout="this.style.backgroundColor=''; this.style.color='white';">
        Iniciar sesión / Registrarse
      </button>
    </div>
  </nav>

  <!-- SECCIÓN DE BIENVENIDA -->
  <div class="text-center text-white py-5" style="background: linear-gradient(90deg, #2196F3, #42A5F5);">
    <h1 class="fw-bold">Bienvenido a Tienda Online</h1>
    <p class="mb-0">Tu tienda de equipos informáticos tecnológicos al mejor y súper precio</p>
  </div>

  <!-- PRODUCTOS -->
  <section class="py-5">
    <div class="container">
      <h2 class="text-center mb-4">NUESTROS PRODUCTOS</h2>

      <div class="row g-4">
        <!-- Aquí van tus productos tal como los tienes -->
        <!-- Producto 1 -->
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="card h-100 shadow-sm text-center">
            <img src="imagenes/audifono.jpg" class="card-img-top img-fluid mx-auto d-block w-75" alt="Audífono Gamer">
            <div class="card-body">
              <h5 class="card-title">Audífono Gamer</h5>
              <p class="card-text">Luces LED</p>
              <p class="card-text fw-bold">S/ 26.90</p>
              <button class="btn btn-primary">Comprar</button>
            </div>
          </div>
        </div>
        <!-- Agrega los demás productos igual que antes -->
      </div>
    </div>
  </section>

  <!-- MODAL LOGIN / REGISTRO -->
  <div class="modal fade" id="authmodal" tabindex="-1" aria-labelledby="authmodallabel1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header bg-dark text-white">
          <h5 class="modal-title" id="authmodallabel1">Accede a Tienda Online</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <div class="nav nav-tabs" id="authtab" role="tablist">
            <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab">Iniciar sesión</button>
            <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab">Registrarse</button>
          </div>

          <div class="tab-content mt-3">
            <!-- LOGIN -->
            <div class="tab-pane fade show active" id="login" role="tabpanel">
              <div class="d-grid gap-2 mb-3">
                <button class="btn btn-danger" id="googleLogin"><i class="bi bi-google"></i> Iniciar sesión con Google</button>
              </div>
              <form class="mx-auto" style="max-width: 350px;">
                <div class="mb-3">
                  <label for="loginEmail" class="form-label">Correo electrónico</label>
                  <input type="email" class="form-control" id="loginEmail" required>
                </div>
                <div class="mb-3">
                  <label for="loginPassword" class="form-label">Contraseña</label>
                  <input type="password" class="form-control" id="loginPassword" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
              </form>
            </div>

            <!-- REGISTRO -->
            <div class="tab-pane fade" id="register" role="tabpanel">
              <form class="mx-auto" style="max-width: 350px;">
                <div class="mb-3">
                  <label class="form-label">Nombre completo</label>
                  <input type="text" class="form-control" id="regNombre" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Correo electrónico</label>
                  <input type="email" class="form-control" id="regEmail" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Contraseña</label>
                  <input type="password" class="form-control" id="regPassword" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Registrarse</button>
              </form>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="bg-dark text-white text-center py-3 mt-5">
    <p class="mb-0">&copy; Todos los derechos reservados JM - Huanuiri Palla 2025 😊</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyArS6xpIackJu-MlN_StQ6oaftd-HIEHpI",
      authDomain: "tiendaonline-232fd.firebaseapp.com",
      projectId: "tiendaonline-232fd",
      storageBucket: "tiendaonline-232fd.appspot.com",
      messagingSenderId: "766983652415",
      appId: "1:766983652415:web:1029784384e8528214248a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // REGISTRO
    const registerForm = document.querySelector("#register form");
    registerForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const nombre = document.getElementById("regNombre").value;
      const email = document.getElementById("regEmail").value;
      const password = document.getElementById("regPassword").value;

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // Enviar correo de verificación
        await sendEmailVerification(user);
        alert("Se ha enviado un correo de verificación a " + email);

        // Guardar en Firestore
        await setDoc(doc(db, "usuarios", user.uid), {
          nombre: nombre,
          email: email,
          fechaRegistro: new Date().toISOString()
        });

        bootstrap.Modal.getInstance(document.getElementById('authmodal')).hide();
        registerForm.reset();
      } catch (error) {
        alert(error.message);
      }
    });

    // LOGIN
    const loginForm = document.querySelector("#login form");
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;
        if (user.emailVerified) {
          alert("¡Bienvenido " + email + "!");
          bootstrap.Modal.getInstance(document.getElementById('authmodal')).hide();
          loginForm.reset();
        } else {
          alert("Por favor, verifica tu correo antes de iniciar sesión.");
        }
      } catch (error) {
        alert(error.message);
      }
    });

    // LOGIN GOOGLE
    const googleBtn = document.getElementById("googleLogin");
    googleBtn.addEventListener("click", async () => {
      const provider = new GoogleAuthProvider();
      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;

        // Guardar en Firestore si es un usuario nuevo
        const docRef = doc(db, "usuarios", user.uid);
        await setDoc(docRef, {
          nombre: user.displayName || "",
          email: user.email,
          fechaRegistro: new Date().toISOString()
        }, { merge: true });

        alert("¡Bienvenido " + user.email + "!");
        bootstrap.Modal.getInstance(document.getElementById('authmodal')).hide();
      } catch (error) {
        alert(error.message);
      }
    });
  </script>

</body>
</html>
