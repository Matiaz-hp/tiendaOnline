<!-- MODAL LOGIN/REGISTRO -->
<div class="modal fade" id="authModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title">Acceder a tu cuenta</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <ul class="nav nav-tabs mb-3">
          <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#loginTab">Iniciar Sesión</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#registerTab">Registrarse</button>
          </li>
        </ul>

        <div class="tab-content">
          <!-- LOGIN -->
          <div class="tab-pane fade show active" id="loginTab">
            <div class="d-grid mb-3">
              <button id="googleLogin" type="button" class="btn btn-danger">
                <i class="bi bi-google"></i> Iniciar sesión con Google
              </button>
            </div>
            <form id="formlogin">
              <div class="mb-3">
                <label>Email</label>
                <input type="email" id="loginEmail" class="form-control" required>
              </div>
              <div class="mb-3">
                <label>Contraseña</label>
                <input type="password" id="loginPassword" class="form-control" required minlength="6">
              </div>
              <button class="btn btn-primary w-100">Iniciar Sesión</button>
            </form>
          </div>

          <!-- REGISTRO -->
          <div class="tab-pane fade" id="registerTab">
            <form id="formRegister">
              <div class="mb-3">
                <label>Nombre completo</label>
                <input type="text" id="regNombre" class="form-control" required>
              </div>
              <div class="mb-3">
                <label>Email</label>
                <input type="email" id="regEmail" class="form-control" required>
              </div>
              <div class="mb-3">
                <label>Contraseña</label>
                <input type="password" id="regPassword" class="form-control" required minlength="6">
              </div>
              <button class="btn btn-primary w-100">Registrarse</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- BOOTSTRAP JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
import { 
  getAuth, 
  GoogleAuthProvider, 
  signInWithPopup, 
  signOut, 
  onAuthStateChanged,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";

// Configuración Firebase
const firebaseConfig = {
  apiKey: "AIzaSyArS6xpIackJu-MlN_StQ6oaftd-HIEHpI",
  authDomain: "tiendaonline-232fd.firebaseapp.com",
  projectId: "tiendaonline-232fd",
  storageBucket: "tiendaonline-232fd.appspot.com",
  messagingSenderId: "766983652415",
  appId: "1:766983652415:web:1029784384a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: 'select_account' }); // <- Forzar selección de correo

// ELEMENTOS
const googleBtn = document.getElementById("googleLogin");
const loginForm = document.getElementById("formlogin");
const registerForm = document.getElementById("formRegister");
const loginItem = document.getElementById("loginItem");

// LOGIN GOOGLE
googleBtn.addEventListener("click", async () => {
  try {
    await signInWithPopup(auth, provider);
    cerrarModalAuth();
  } catch (err) {
    alert("Error al iniciar sesión con Google. Revisa tu dominio autorizado en Firebase: matiaz-hp.github.io");
    console.error(err);
  }
});

// REGISTRO EMAIL/PASS
registerForm.addEventListener("submit", async e => {
  e.preventDefault();
  const email = document.getElementById("regEmail").value.trim();
  const pass = document.getElementById("regPassword").value;
  try {
    await createUserWithEmailAndPassword(auth, email, pass);
    alert("Registro exitoso");
    cerrarModalAuth();
  } catch (err) {
    alert("Error en el registro: " + err.message);
    console.error(err);
  }
});

// LOGIN EMAIL/PASS
loginForm.addEventListener("submit", async e => {
  e.preventDefault();
  const email = document.getElementById("loginEmail").value.trim();
  const pass = document.getElementById("loginPassword").value;
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    cerrarModalAuth();
  } catch (err) {
    alert("Credenciales inválidas");
    console.error(err);
  }
});

// FUNCIONES
function cerrarModalAuth() {
  const authModal = bootstrap.Modal.getInstance(document.getElementById("authModal"));
  if(authModal) authModal.hide();
}

function pintarUsuarioNavbar(user){
  if(document.getElementById("userinfo")) return;
  const foto = user.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.displayName || user.email)}`;
  const nombre = user.displayName || user.email;

  const li = document.createElement("li");
  li.className = "nav-item dropdown ms-3 d-flex align-items-center";
  li.id = "userinfo";
  li.innerHTML = `
    <button class="btn btn-link position-relative me-3 text-white" id="btnCarritoIcono" title="ver carrito">
      <i class="bi bi-cart3 fs-5 text-white"></i>
      <span id="contadorCarrito" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
    </button>
    <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" data-bs-toggle="dropdown">
      <img src="${foto}" class="rounded-circle me-2" width="32" height="32">
      <span class="text-white"> ${nombre}</span>
    </a>
    <ul class="dropdown-menu dropdown-menu-end">
      <li><a class="dropdown-item" href="#">Mis pedidos</a></li>
      <li><hr class="dropdown-divider"></li>
      <li><a class="dropdown-item text-danger" href="#" id="cerrarSesionBtn">Cerrar sesión</a></li>
    </ul>
  `;
  document.querySelector(".navbar-nav").appendChild(li);
  document.getElementById("cerrarSesionBtn").addEventListener("click", async () => {
    await signOut(auth);
  });
}

function limpiarUsuarioNavbar(){
  const info = document.getElementById("userinfo");
  if(info) info.remove();
}

// MANTENER SESIÓN
onAuthStateChanged(auth, (user) => {
  if(user){
    pintarUsuarioNavbar(user);
    loginItem.classList.add("d-none");
  } else {
    limpiarUsuarioNavbar();
    loginItem.classList.remove("d-none");
  }
});
</script>

</body>
</html>
