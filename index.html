<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda Online</title>
  <link rel="icon" href="imagenes/favicon.png" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .modal-body form { max-width: 360px; margin: 0 auto; padding: 5px 10px; }
    .modal-body label { font-weight: 500; }
    .modal-body .form-control { margin-bottom: 15px; border-radius: 6px; }
    #googleLogin {
      background-color: #fff;
      border: 1px solid #dadce0;
      color: #3c4043;
      font-weight: 500;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 0;
      border-radius: 4px;
      transition: background-color 0.2s ease;
    }
    #googleLogin:hover { background-color: #f7f8f8; }
    #googleLogin img { height: 18px; width: 18px; }
    .modal-content { border-radius: 10px; }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-dark bg-dark px-4 py-3">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <span class="navbar-brand fw-bold fs-4">TiendaOnline</span>
      <div id="authButtons">
        <button class="btn border border-light text-light"
          data-bs-toggle="modal" data-bs-target="#authmodal"
          onmouseover="this.style.backgroundColor='white'; this.style.color='black';"
          onmouseout="this.style.backgroundColor=''; this.style.color='white';">
          Iniciar sesión / Registrarse
        </button>
      </div>
    </div>
  </nav>

  <!-- SECCIÓN DE BIENVENIDA -->
  <div class="text-center text-white py-5" style="background: linear-gradient(90deg, #2196F3, #42A5F5);">
    <h1 class="fw-bold">Bienvenido a Tienda Online</h1>
    <p class="mb-0">Tu tienda de equipos informáticos tecnológicos al mejor y súper precio</p>
  </div>

  <!-- PRODUCTOS -->
  <section class="py-5">
    <div class="container">
      <h2 class="text-center mb-4">NUESTROS PRODUCTOS</h2>
      <div class="row g-4" id="productosContainer">
        <!-- Productos dinámicos desde Firestore o ejemplos -->
      </div>
    </div>
  </section>

  <!-- MODAL LOGIN / REGISTRO -->
  <div class="modal fade" id="authmodal" tabindex="-1" aria-labelledby="authmodallabel1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-dark text-white">
          <h5 class="modal-title" id="authmodallabel1">Accede a Tienda Online</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <ul class="nav nav-tabs" id="authtab" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab">Iniciar sesión</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab">Registrarse</button>
            </li>
          </ul>

          <div class="tab-content mt-3">
            <!-- LOGIN -->
            <div class="tab-pane fade show active" id="login" role="tabpanel">
              <div class="d-grid gap-2 mb-3">
                <button class="btn w-100" id="googleLogin">
                  <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                  Iniciar sesión con Google
                </button>
              </div>
              <form id="loginForm">
                <div class="mb-3">
                  <label for="loginEmail" class="form-label">Correo electrónico</label>
                  <input type="email" class="form-control" id="loginEmail" required>
                </div>
                <div class="mb-3">
                  <label for="loginPassword" class="form-label">Contraseña</label>
                  <input type="password" class="form-control" id="loginPassword" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
              </form>
            </div>

            <!-- REGISTRO -->
            <div class="tab-pane fade" id="register" role="tabpanel">
              <form id="registerForm">
                <div class="mb-3">
                  <label class="form-label">Nombre completo</label>
                  <input type="text" class="form-control" id="regNombre" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Correo electrónico</label>
                  <input type="email" class="form-control" id="regEmail" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Contraseña</label>
                  <input type="password" class="form-control" id="regPassword" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Registrarse</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="bg-dark text-white text-center py-3 mt-5">
    <p class="mb-0">&copy; Todos los derechos reservados JM - Huanuiri Palla 2025 😊</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- FIREBASE -->
  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {
  getAuth, setPersistence, browserSessionPersistence,
  createUserWithEmailAndPassword, signInWithEmailAndPassword,
  sendEmailVerification, GoogleAuthProvider, signInWithPopup,
  signOut, onAuthStateChanged, updateProfile
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

import {
  getFirestore, doc, setDoc, getDoc, collection, getDocs
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyArS6xpIackJu-MlN_StQ6oaftd-HIEHpI",
  authDomain: "tiendaonline-232fd.firebaseapp.com",
  projectId: "tiendaonline-232fd",
  storageBucket: "tiendaonline-232fd.appspot.com",
  messagingSenderId: "766983652415",
  appId: "1:766983652415:web:1029784384e8528214248a"
};

async function initFirebase() {
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  await setPersistence(auth, browserSessionPersistence);

  const authButtons = document.getElementById("authButtons");
  const productosContainer = document.getElementById("productosContainer");

  // ---------------- REGISTRO ----------------
  const registerForm = document.getElementById("registerForm");
  registerForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const nombre = document.getElementById("regNombre").value.trim();
    const email = document.getElementById("regEmail").value.trim();
    const password = document.getElementById("regPassword").value.trim();

    try {
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      // Actualizar nombre
      await updateProfile(user, { displayName: nombre });

      // Guardar en Firestore
      await setDoc(doc(db, "usuarios", user.uid), {
        uid: user.uid,
        nombre: nombre,
        email: email,
        photoURL: ""
      });

      // Enviar correo de verificación
      await sendEmailVerification(user);

      alert("✅ Cuenta creada correctamente. Revisa tu correo de verificación.");
      registerForm.reset();
      bootstrap.Modal.getInstance(document.getElementById('authmodal')).hide();
      await signOut(auth); // cerrar sesión hasta verificar correo
    } catch (error) {
      console.error(error);
      alert("⚠️ Error al registrarse: " + error.message);
    }
  });

  // ---------------- LOGIN ----------------
  const loginForm = document.getElementById("loginForm");
  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value.trim();

    try {
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      if (!user.emailVerified) {
        await signOut(auth);
        alert("⚠️ Verifica tu correo antes de iniciar sesión.");
        return;
      }

      alert("👋 Bienvenido, " + email);
      loginForm.reset();
      bootstrap.Modal.getInstance(document.getElementById('authmodal')).hide();
    } catch {
      alert("❌ Error: correo o contraseña incorrectos.");
    }
  });

  // ---------------- LOGIN CON GOOGLE ----------------
  const googleBtn = document.getElementById("googleLogin");
  googleBtn.addEventListener("click", async () => {
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    try {
      const result = await signInWithPopup(auth, provider);
      const user = result.user;

      await setDoc(doc(db, "usuarios", user.uid), {
        uid: user.uid,
        nombre: user.displayName || "",
        email: user.email,
        photoURL: user.photoURL || ""
      }, { merge: true });

      alert("👋 Bienvenido, " + user.email);
      bootstrap.Modal.getInstance(document.getElementById('authmodal')).hide();
    } catch (error) {
      alert("⚠️ Error con Google: " + error.message);
    }
  });

  // ---------------- FUNCIONES PRODUCTOS ----------------
  async function cargarProductos() {
    productosContainer.innerHTML = "";

    const productosSnap = await getDocs(collection(db, "productos"));

    if (productosSnap.empty) {
      // Productos de ejemplo
      const ejemplo = [
        { nombre: "Mouse Gamer", descripcion: "Ejemplo de producto", precio: 120, imagenURL: "imagenes/mouse.jpg" },
        { nombre: "Teclado Mecánico", descripcion: "Ejemplo de producto", precio: 250, imagenURL: "imagenes/teclado.jpg" },
        { nombre: "Monitor 24\"", descripcion: "Ejemplo de producto", precio: 800, imagenURL: "imagenes/monitor.jpg" }
      ];

      ejemplo.forEach(prod => {
        const col = document.createElement("div");
        col.className = "col-12 col-sm-6 col-lg-3";
        col.innerHTML = `
          <div class="card h-100 shadow-sm text-center">
            <img src="${prod.imagenURL}" alt="${prod.nombre}" class="card-img-top mx-auto d-block w-75">
            <div class="card-body">
              <h5 class="card-title">${prod.nombre}</h5>
              <p class="card-text">${prod.descripcion}</p>
              <p class="card-text fw-bold">S/ ${prod.precio}</p>
              <button class="btn btn-primary" disabled>Comprar</button>
            </div>
          </div>
        `;
        productosContainer.appendChild(col);
      });
      return;
    }

    productosSnap.forEach(docSnap => {
      const prod = docSnap.data();
      const col = document.createElement("div");
      col.className = "col-12 col-sm-6 col-lg-3";
      col.innerHTML = `
        <div class="card h-100 shadow-sm text-center">
          <img src="${prod.imagenURL}" alt="${prod.nombre}" class="card-img-top mx-auto d-block w-75">
          <div class="card-body">
            <h5 class="card-title">${prod.nombre}</h5>
            <p class="card-text">${prod.descripcion}</p>
            <p class="card-text fw-bold">S/ ${prod.precio}</p>
            <button class="btn btn-primary comprarBtn" data-id="${docSnap.id}">Comprar</button>
          </div>
        </div>
      `;
      productosContainer.appendChild(col);
    });

    // Botones de compra
    document.querySelectorAll(".comprarBtn").forEach(btn => {
      btn.addEventListener("click", async (e) => {
        const prodId = e.target.dataset.id;
        if (!auth.currentUser) { alert("⚠️ Debes iniciar sesión para comprar"); return; }

        try {
          const prodDoc = await getDoc(doc(db, "productos", prodId));
          const prodData = prodDoc.data();
          await setDoc(doc(db, "pedidos", `${auth.currentUser.uid}_${Date.now()}`), {
            uid: auth.currentUser.uid,
            productoId: prodId,
            nombre: prodData.nombre,
            precio: prodData.precio,
            fecha: new Date().toISOString(),
            estado: "pendiente"
          });
          alert("✅ Pedido realizado!");
        } catch (err) {
          console.error(err);
          alert("⚠️ Error al realizar el pedido");
        }
      });
    });
  }

  // ---------------- CONTROL DE SESIÓN ----------------
  onAuthStateChanged(auth, async (user) => {
    authButtons.innerHTML = "";
    await cargarProductos();

    if (user && !user.emailVerified) {
      await signOut(auth);
      return;
    }

    if (user) {
      const userDoc = await getDoc(doc(db, "usuarios", user.uid));
      const data = userDoc.exists() ? userDoc.data() : {};
      const displayName = data.nombre || user.displayName || user.email.split("@")[0];
      const photoURL = data.photoURL || "";

      const profileDiv = document.createElement("div");
      profileDiv.className = "d-flex align-items-center gap-2 text-light";

      const img = document.createElement("img");
      img.src = photoURL;
      img.width = 32; img.height = 32;
      img.className = "rounded-circle";

      const nameSpan = document.createElement("span");
      nameSpan.textContent = displayName;

      const logoutBtn = document.createElement("button");
      logoutBtn.className = "btn btn-danger btn-sm";
      logoutBtn.textContent = "Cerrar sesión";
      logoutBtn.onclick = async () => {
        await signOut(auth);
        const iframe = document.createElement("iframe");
        iframe.src = "https://accounts.google.com/logout";
        iframe.style.display = "none";
        document.body.appendChild(iframe);
        setTimeout(() => iframe.remove(), 1500);
        alert("👋 Sesión cerrada.");
      };

      profileDiv.append(img, nameSpan, logoutBtn);
      authButtons.appendChild(profileDiv);
    } else {
      const loginBtn = document.createElement("button");
      loginBtn.className = "btn border border-light text-light";
      loginBtn.setAttribute("data-bs-toggle", "modal");
      loginBtn.setAttribute("data-bs-target", "#authmodal");
      loginBtn.textContent = "Iniciar sesión / Registrarse";
      loginBtn.onmouseover = () => { loginBtn.style.backgroundColor = 'white'; loginBtn.style.color = 'black'; };
      loginBtn.onmouseout = () => { loginBtn.style.backgroundColor = ''; loginBtn.style.color = 'white'; };
      authButtons.appendChild(loginBtn);
    }
  });
}

initFirebase();
  </script>
</body>
</html>
