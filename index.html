<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda Online</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    #alertaAgregado {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 2000;
      display: none;
      padding: 10px 14px;
      border-radius: 6px;
      font-weight: 600;
    }
    .pedido-item {
      border-bottom: 1px solid #eaeaea;
      padding: 10px 0;
    }
  </style>
</head>

<body>

<div id="alertaAgregado" class="alert alert-success"></div>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">Tienda Online</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item" id="usuarioMenu" style="display:none;">
          <div class="dropdown">
            <button class="btn btn-outline-light dropdown-toggle" data-bs-toggle="dropdown">
              <i class="bi bi-person-circle"></i> <span id="usuarioEmail"></span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="#" data-bs-toggle="modal" data-bs-target="#misPedidosModal">Mis pedidos</a></li>
              <li><button class="dropdown-item text-danger" onclick="logout()">Cerrar sesión</button></li>
            </ul>
          </div>
        </li>

        <li class="nav-item" id="loginItem">
          <button class="btn btn-outline-light" data-bs-toggle="modal" data-bs-target="#authModal">
            Iniciar sesión / Registrarse
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>


<!-- PRODUCTOS -->
<div class="container mt-4">
  <h2 class="text-center fw-bold mb-4">Productos Disponibles</h2>
  <div class="row" id="productosContainer"></div>
</div>


<!-- MODAL LOGIN/REGISTRO -->
<div class="modal fade" id="authModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title">Autenticación</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <div class="mb-3">
          <label>Email:</label>
          <input type="email" id="emailInput" class="form-control">
        </div>

        <div class="mb-3">
          <label>Contraseña:</label>
          <input type="password" id="passwordInput" class="form-control">
        </div>

        <button class="btn btn-primary w-100 mb-2" onclick="login()">Iniciar Sesión</button>
        <button class="btn btn-success w-100" onclick="register()">Registrarse</button>

      </div>
    </div>
  </div>
</div>


<!-- MODAL CARRITO -->
<div class="modal fade" id="carritoModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title">Mi carrito</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <div id="carritoContainer"></div>
        <h4 class="text-end mt-3">Total: S/<span id="totalCarrito">0.00</span></h4>
      </div>

      <div class="modal-footer">
        <button class="btn btn-success w-100" onclick="guardarPedido()">Comprar</button>
      </div>

    </div>
  </div>
</div>


<!-- MODAL MIS PEDIDOS -->
<div class="modal fade" id="misPedidosModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title">Mis pedidos</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <div id="listaPedidos"></div>
      </div>

    </div>
  </div>
</div>



<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  signOut
} from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  query,
  where,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "TU_AUTH_DOMAIN",
  projectId: "TU_PROJECT_ID",
  storageBucket: "TU_STORAGE",
  messagingSenderId: "TU_SENDER",
  appId: "TU_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore(app);



/* =======================
    PRODUCTOS
========================= */

async function cargarProductos() {
  const productosContainer = document.getElementById("productosContainer");
  productosContainer.innerHTML = "";

  const productosSnap = await getDocs(collection(db, "Productos"));

  productosSnap.forEach((doc) => {
    const p = doc.data();
    productosContainer.innerHTML += `
      <div class="col-md-4 mb-4">
        <div class="card shadow-sm">
          <img src="${p.imagen}" class="card-img-top" style="height:200px; object-fit:cover;">
          <div class="card-body">
            <h5 class="card-title">${p.nombre}</h5>
            <p class="card-text">S/ ${p.precio.toFixed(2)}</p>
            <button class="btn btn-dark w-100" onclick="addCarrito('${doc.id}', '${p.nombre}', ${p.precio})">
              Agregar al carrito
            </button>
          </div>
        </div>
      </div>
    `;
  });
}
cargarProductos();



/* =======================
    CARRITO
========================= */

let carrito = [];

window.addCarrito = function(id, nombre, precio) {
  carrito.push({ id, nombre, precio });

  document.getElementById("alertaAgregado").innerHTML = "Producto agregado ✔";
  document.getElementById("alertaAgregado").style.display = "block";

  setTimeout(() => {
    document.getElementById("alertaAgregado").style.display = "none";
  }, 1500);

  actualizarCarrito();
  new bootstrap.Modal("#carritoModal").show();
};

function actualizarCarrito() {
  let html = "";
  let total = 0;

  carrito.forEach((item, i) => {
    total += item.precio;
    html += `
      <div class="pedido-item">
        ${item.nombre} - S/${item.precio.toFixed(2)}
        <button class="btn btn-sm btn-danger float-end" onclick="quitarItem(${i})">
          <i class="bi bi-x"></i>
        </button>
      </div>
    `;
  });

  document.getElementById("carritoContainer").innerHTML = html || "<p class='text-center'>Carrito vacío</p>";
  document.getElementById("totalCarrito").innerText = total.toFixed(2);
}

window.quitarItem = function(i) {
  carrito.splice(i, 1);
  actualizarCarrito();
};



/* =======================
    GUARDAR PEDIDO
========================= */

window.guardarPedido = async function() {
  const user = auth.currentUser;

  if (!user) {
    alert("Debes iniciar sesión");
    return;
  }

  if (carrito.length === 0) {
    alert("Tu carrito está vacío");
    return;
  }

  try {
    await addDoc(collection(db, "Pedidos"), {
      userId: user.uid,
      productos: carrito,
      fecha: new Date()
    });

    carrito = [];
    actualizarCarrito();

    alert("Pedido realizado correctamente ✔");
  } catch (e) {
    alert("Ocurrió un error al guardar el pedido");
  }
};



/* =======================
     MIS PEDIDOS
========================= */

async function cargarMisPedidos() {
  const user = auth.currentUser;
  const lista = document.getElementById("listaPedidos");

  lista.innerHTML = "<p class='text-center'>Cargando...</p>";

  const q = query(
    collection(db, "Pedidos"),
    where("userId", "==", user.uid),
    orderBy("fecha", "desc")
  );

  const snap = await getDocs(q);

  if (snap.empty) {
    lista.innerHTML = "<p class='text-center text-muted'>Aún no tienes pedidos</p>";
    return;
  }

  let html = "";
  snap.forEach((doc) => {
    const p = doc.data();
    html += `
      <div class="pedido-item">
        <strong>Fecha:</strong> ${new Date(p.fecha.toDate()).toLocaleString()}<br>
        <strong>Productos:</strong><br>
        ${p.productos.map(x => `- ${x.nombre} (S/${x.precio})`).join("<br>")}
      </div>
    `;
  });

  lista.innerHTML = html;
}

document.getElementById("misPedidosModal").addEventListener("show.bs.modal", cargarMisPedidos);




/* =======================
     LOGIN / REGISTRO
========================= */

window.login = async function() {
  const email = emailInput.value;
  const pass = passwordInput.value;

  try {
    await signInWithEmailAndPassword(auth, email, pass);
    bootstrap.Modal.getInstance(authModal).hide();
  } catch (e) {
    alert("Error al iniciar sesión");
  }
};

window.register = async function() {
  const email = emailInput.value;
  const pass = passwordInput.value;

  try {
    await createUserWithEmailAndPassword(auth, email, pass);
    bootstrap.Modal.getInstance(authModal).hide();
  } catch (e) {
    alert("Error al registrarse");
  }
};

window.logout = function() {
  signOut(auth);
};



/* =======================
     SESSION STATE
========================= */

onAuthStateChanged(auth, (user) => {
  if (user) {
    usuarioMenu.style.display = "block";
    loginItem.style.display = "none";
    usuarioEmail.innerText = user.email;
  } else {
    usuarioMenu.style.display = "none";
    loginItem.style.display = "block";
  }
});

</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
